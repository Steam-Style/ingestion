services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: steam-style-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      coolify:
        aliases:
          - qdrant-stable

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steam-style-ingestion
    restart: unless-stopped
    depends_on:
      - qdrant
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import time,sys; sys.exit(0 if time.time() - float(open('/tmp/heartbeat').read()) < 1800 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      - DATABASE_URL=${DATABASE_URL:?}
      - COLLECTION_NAME=${COLLECTION_NAME:-Steam-Style-Items}
      - DEVICE=${DEVICE:-cpu}
      - MODEL_NAME=${MODEL_NAME:-google/siglip2-base-patch16-224}
    volumes:
      - hf_cache:/data/hf

volumes:
  qdrant_storage:
  hf_cache:

networks:
  coolify:
    external: true
